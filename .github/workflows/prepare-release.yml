name: Prepare Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Target version, such as 0.2.0 or 0.2.0-beta.1"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: prepare-release
  cancel-in-progress: false

jobs:
  prepare:
    if: ${{ github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Validate release version
        run: |
          node --input-type=module -e '
            import { readFileSync } from "node:fs";
            import semver from "semver";

            const currentVersion = JSON.parse(readFileSync("package.json", "utf8")).version;
            const targetVersion = process.env.RELEASE_VERSION;
            if (!semver.valid(targetVersion)) {
              throw new Error(`Invalid release version: ${targetVersion}`);
            }
            if (!semver.gt(targetVersion, currentVersion)) {
              throw new Error(`Release version ${targetVersion} must be greater than ${currentVersion}`);
            }
          '
        env:
          RELEASE_VERSION: ${{ inputs.version }}

      - name: Verify release readiness
        run: pnpm run check

      - name: Configure git author
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Create release commit and tag
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_TOKEN secret is required to push the release commit and tag." >&2
            exit 1
          fi
          auth_header="$(printf 'x-access-token:%s' "$GH_TOKEN" | base64 | tr -d '\n')"
          GIT_CONFIG_COUNT=1 \
          GIT_CONFIG_KEY_0=http.https://github.com/.extraheader \
          GIT_CONFIG_VALUE_0="AUTHORIZATION: basic $auth_header" \
            pnpm release -- --version "$RELEASE_VERSION" --yes
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
          RELEASE_VERSION: ${{ inputs.version }}
