name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Verify tag source
        run: |
          if ! git merge-base --is-ancestor HEAD "origin/$DEFAULT_BRANCH"; then
            echo "Release tag must point to a commit on $DEFAULT_BRANCH." >&2
            exit 1
          fi
        env:
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      - run: pnpm install --frozen-lockfile

      - name: Verify release tag
        run: |
          package_version="$(node -p "require('./package.json').version")"
          expected_tag="v${package_version}"
          if [ "$RELEASE_TAG" != "$expected_tag" ]; then
            echo "Release tag $RELEASE_TAG does not match package version $package_version." >&2
            exit 1
          fi
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Verify release source
        run: pnpm run check

      - name: Build package
        run: pnpm run build

      - name: Publish package
        run: |
          package_version="$(node -p "require('./package.json').version")"
          case "$package_version" in
            *-alpha|*-alpha.*) npm_tag=alpha ;;
            *-beta|*-beta.*) npm_tag=beta ;;
            *-rc|*-rc.*) npm_tag=rc ;;
            *-*) npm_tag=next ;;
            *) npm_tag=latest ;;
          esac
          npm publish --access public --tag "$npm_tag"
